<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYOMUSIC - Bulawayo Marketplace</title>
<link rel="icon" href="music/profile.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#050505;color:#fff;padding-bottom:80px}
header{position:sticky;top:0;z-index:20;background:#080808;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:22px;display:flex;gap:8px;align-items:center}
.logo i{background:#ffcc00;color:#000;width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.hero{padding:50px 20px;text-align:center}
.grid{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#111;border:1px solid #1e1e1e;border-radius:16px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover;background:#0a0a0a}
.body{padding:12px}
.btn{padding:8px 14px;border-radius:10px;text-decoration:none;font-weight:800;font-size:11px;display:inline-flex;gap:6px;align-items:center;border:none;cursor:pointer}
.btn-y{background:#ffcc00;color:#000}.btn-g{background:#25D366;color:#fff}.btn-d{background:#1a1a1a;color:#ccc;border:1px solid #222}
.player{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:99}
.empty{max-width:700px;margin:40px auto;text-align:center;border:1px dashed #222;padding:30px;border-radius:16px}
</style>
</head><body>
<header>
<div class="logo"><i class="fas fa-music"></i> BYOMUSIC</div>
<div style="display:flex;gap:6px">
<a href="artist.html" class="btn btn-d">Artist Login</a>
<a href="https://wa.me/263789706161" class="btn btn-g"><i class="fab fa-whatsapp"></i> 78 970 6161</a>
</div>
</header>

<div class="hero">
<h1 style="font-size:42px;font-weight:900">BYO<span style="color:#ffcc00">MUSIC</span></h1>
<p style="color:#888;max-width:600px;margin:10px auto;font-size:13px">Bulawayo music - plays instantly. Admin uploads via WhatsApp to +263 78 970 6161</p>
<span id="stat" style="color:#444;font-size:12px"></span>
</div>

<div class="grid" id="grid"></div>
<div id="empty" class="empty" style="display:none">
<h3 style="color:#ffcc00">No music yet</h3>
<p style="color:#666;font-size:13px">Admin needs to add songs in 789706161.html</p>
</div>

<div class="player" id="player">
<img id="pImg" width="44" height="44" style="border-radius:8px">
<div style="flex:1"><b id="pTitle" style="font-size:12px"></b><p id="pArtist" style="font-size:11px;color:#888"></p></div>
<audio id="audio" controls style="width:180px"></audio>
<button onclick="document.getElementById('player').style.display='none'" style="background:#222;color:#888;border:none;padding:6px 10px;border-radius:8px">X</button>
</div>

<script>
const KEY="byomusic_songs_v2_final";
let songs = JSON.parse(localStorage.getItem(KEY)||"[]");

function render(){
 const grid=document.getElementById('grid');
 const empty=document.getElementById('empty');
 document.getElementById('stat').innerText=`${songs.length} songs • ${songs.filter(s=>s.sell).length} for sale`;
 if(songs.length===0){ grid.innerHTML=""; empty.style.display="block"; return; }
 empty.style.display="none";
 grid.innerHTML=songs.map(s=>`
  <div class="card">
    <img src="${s.img}" onerror="this.src='https://via.placeholder.com/400x220?text=BYOMUSIC'">
    <div class="body">
      <div style="display:flex;justify-content:space-between"><div><b>${s.title}</b><div style="color:#ffcc00;font-size:12px">${s.artist}</div></div><div style="font-weight:900;color:${s.sell?'#ffcc00':'#25D366'};font-size:13px">${s.sell?'$'+s.price:'FREE'}</div></div>
      <div style="color:#666;font-size:10px;margin:6px 0">${s.genre} • ${s.plays||0} plays • ${s.audioData?'Instant Play':'Needs /music/ upload'}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn" style="background:#fff;color:#000" onclick="playSong('${s.id}')"><i class="fas fa-play"></i> Play</button>
        ${s.sell?`<button class="btn btn-y" onclick="buySong('${s.id}')"><i class="fab fa-whatsapp"></i> Buy</button>`:`<button class="btn btn-g" onclick="playSong('${s.id}')">Free Play</button>`}
      </div>
    </div>
  </div>
 `).join('');
}

function playSong(id){
 const s = songs.find(x=>x.id===id);
 if(!s){ alert("Song not found"); return; }
 document.getElementById('player').style.display='flex';
 document.getElementById('pImg').src = s.img;
 document.getElementById('pTitle').innerText = s.title;
 document.getElementById('pArtist').innerText = s.artist;
 const audio = document.getElementById('audio');
 
 // FIXED: Use audioData first, else audio path
 if(s.audioData && s.audioData.startsWith('data:audio')){
   audio.src = s.audioData;
   audio.play().then(()=>{ 
     s.plays=(s.plays||0)+1; localStorage.setItem(KEY, JSON.stringify(songs)); render(); 
   }).catch(err=>alert("Audio error: "+err));
 } else if(s.audio){
   audio.src = s.audio;
   audio.play().catch(()=>alert("File not on GitHub yet! Admin must upload "+s.audio+" to /music/ folder via Spck Editor"));
 } else {
   alert("No audio data - re-add song with MP3 file");
 }
}

function buySong(id){
 const s = songs.find(x=>x.id===id);
 window.open(`https://wa.me/263789706161?text=Hi%20I%20want%20to%20BUY%20${encodeURIComponent(s.title)}%20by%20${s.artist}%20for%20$${s.price}%20ID:${s.id}`,'_blank');
}

render();
</script>
</body></html>
