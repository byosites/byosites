<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - BYOMUSIC</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px}
input,textarea,select{width:100%;padding:12px;background:#111;border:1px solid #333;color:#fff;border-radius:10px;margin:6px 0;box-sizing:border-box}
textarea{height:70px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:900;width:100%;cursor:pointer;margin-top:8px}
.btn-y{background:#ffcc00;color:#000}.btn-r{background:#ff4444;color:#fff}.btn-o{background:#ff8800;color:#fff}.btn-b{background:#222;color:#fff;border:1px solid #333}.btn-g{background:#25D366;color:#fff}.btn-blue{background:#00aaff;color:#fff}
.btn-reset{background:#ff0000;color:#fff;border:2px solid #ff4444}
.card{background:#111;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0}
.lock{max-width:480px;margin:30px auto;text-align:center;border:1px solid #222;padding:24px;border-radius:18px;background:#0a0a0a}
.progress{height:10px;background:#222;border-radius:10px;overflow:hidden;margin:8px 0}.progress div{height:100%;background:#ffcc00;width:0%}
.row{display:flex;gap:6px;flex-wrap:wrap}.row .btn{width:auto;flex:1;padding:8px 10px;font-size:11px}
.suspended{opacity:0.45;border-color:#ff4444!important}
audio{width:100%;margin:6px 0}
.badge{font-size:10px;padding:3px 7px;border-radius:6px;margin-left:4px}
.badge-live{background:#25D366}.badge-sus{background:#ff4444}.badge-code{background:#00aaff;color:#fff}.badge-secure{background:#ff8800;color:#000;font-weight:900}.badge-free{background:#25D366}
.section{border:1px solid #1e1e1e;background:#0f0f0f;padding:14px;border-radius:12px;margin-top:14px}
.label{font-size:11px;color:#ffcc00;font-weight:900;margin:8px 0 2px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codeBox{background:#001a33;border:1px dashed #00aaff;padding:10px;border-radius:10px;text-align:center;margin:6px 0}
.searchWrap{position:sticky;top:0;z-index:20;background:#000;padding:10px 0;border-bottom:1px solid #222}
.searchBox{display:flex;gap:6px;background:#111;border:1px solid #333;border-radius:14px;padding:8px 12px;align-items:center}
.searchBox input{flex:1;background:transparent;border:none;margin:0;padding:6px;color:#fff;outline:none;font-size:14px}
.secureBox{background:#1a0f00;border:1px solid #ff8800;padding:10px;border-radius:10px;margin:6px 0}
.resetSection{background:#1a0000;border:2px solid #ff0000;padding:14px;border-radius:12px;margin-top:20px}
</style></head><body>

<div id="lock" class="lock">
<h2 style="color:#ffcc00">BYOMUSIC ADMIN</h2>
<p style="color:#888;font-size:11px">Secure Access</p>
<input id="pin" type="password" placeholder="Enter PIN">
<input id="ghToken" type="password" placeholder="GitHub Token ghp_xxx">
<button class="btn btn-y" onclick="unlock()">Enter Admin</button>
<p id="lockMsg" style="font-size:11px;color:#888"></p>
</div>

<div id="panel" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<h3>Admin Panel <span id="count" style="color:#666;font-size:11px"></span></h3>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn-b" style="width:auto;padding:6px 10px" onclick="loadData()">Refresh</button>
<button class="btn-b" style="width:auto;padding:6px 10px" onclick="exportData()">Backup</button>
</div>
</div>

<div class="searchWrap">
<div class="searchBox">
<span style="color:#666">🔍</span>
<input id="search" placeholder="Search title, artist, genre, code, username..." oninput="render()">
<button class="btn-b" style="width:auto;padding:6px 10px" onclick="search.value='';render()">Clear</button>
</div>
<div id="searchInfo" style="font-size:11px;color:#ffcc00;margin-top:6px"></div>
</div>

<div class="section" style="border-color:#ff8800">
<h4 style="color:#ff8800">🔒 Active Codes (10 Minutes)</h4>
<div id="secureList"></div>
<button class="btn btn-r" style="padding:8px;font-size:11px" onclick="clearExpired()">Clear Expired</button>
</div>

<div class="section">
<h4 style="color:#ffcc00">👤 Artists</h4>
<input id="aName" placeholder="Artist Name *">
<input id="aPass" placeholder="Password *">
<div class="grid2"><input id="aWA" placeholder="WhatsApp +263..."><input id="aLoc" placeholder="Location"></div>
<input type="file" id="aPhotoFile" accept="image/*">
<textarea id="aBio" placeholder="Biography *"></textarea>
<div class="grid2"><input id="aGenre" placeholder="Genre"><input id="aYear" type="number" placeholder="Year"></div>
<div class="grid2"><input id="aFB" placeholder="Facebook"><input id="aIG" placeholder="Instagram"></div>
<div class="grid2"><input id="aYT" placeholder="YouTube"><input id="aTik" placeholder="TikTok"></div>
<div class="codeBox"><span style="font-size:11px;color:#00aaff">Approval Code</span><br><b id="aCodeShow" style="font-size:20px;letter-spacing:3px;color:#ffcc00">----</b></div>
<button class="btn btn-y" onclick="createArtist()">Save Artist</button>
<p id="aMsg" style="font-size:12px;color:#25D366"></p>
<div id="artistList"></div>
</div>

<div class="section">
<h4 style="color:#ffcc00">🎵 Music Management</h4>
<div class="grid2"><div><span class="label">MP3 File *</span><input type="file" id="mp3File" accept="audio/*"></div><div><span class="label">Cover Image *</span><input type="file" id="coverFile" accept="image/*"></div></div>
<div class="grid2"><input id="sArtist" placeholder="Artist Name *"><input id="sTitle" placeholder="Song Title *"></div>
<div class="grid2"><select id="sGenre"><option>Amapiano</option><option>Afro House</option><option>Zimdancehall</option><option>Hip Hop</option><option>Gqom</option><option>Afrobeat</option><option>Gospel</option></select><input id="sDate" type="date"></div>
<textarea id="sBio" placeholder="About release..."></textarea>
<div class="grid2"><textarea id="sLyrics" placeholder="Lyrics"></textarea><textarea id="sCredits" placeholder="Credits"></textarea></div>
<div class="grid2"><input id="sISRC" placeholder="ISRC"><input id="sComposer" placeholder="Composer"></div>
<div class="grid2"><input id="sPrice" type="number" placeholder="Price USD (0=free)"><select id="sExplicit"><option value="no">Clean</option><option value="yes">Explicit</option></select></div>
<label><input type="checkbox" id="sSell"> Paid Song?</label> <label style="margin-left:12px"><input type="checkbox" id="sFeatured"> Featured?</label>
<div class="progress"><div id="prog"></div></div>
<p id="sMsg" style="font-size:12px;color:#ffcc00"></p>
<button class="btn btn-y" onclick="autoUpload()">Upload Song</button>
<hr style="border-color:#222;margin:14px 0">
<h5 style="color:#ff8800">Edit Song</h5>
<div class="grid2"><input id="editId" placeholder="Song ID" readonly><input id="editApproval" placeholder="Approval Code *"></div>
<div class="grid2"><input id="editTitle" placeholder="New Title"><input id="editPrice" type="number" placeholder="New Price"></div>
<textarea id="editBio" placeholder="New Bio"></textarea>
<div class="row"><button class="btn btn-o" onclick="saveEditMusic()">Save Changes</button><button class="btn btn-b" onclick="clearEdit()">Clear</button></div>
</div>

<div id="songList"></div>
</div>

<script>
const KEY_SONGS="byomusic_songs_v2_final"; const KEY_ARTISTS="byomusic_artists_secure"; const KEY_TOKEN="byomusic_gh_token"; const KEY_SECURE_CODES="byomusic_secure_codes_v54"; const PIN="457585";
let GH_TOKEN=""; let songs=[]; let artists=[]; let secureCodes=[];

function genCode(){ return Math.floor(100000 + Math.random()*900000).toString(); }
function genSecureCodeOnly(){ return 'BYO-'+Math.floor(100000+Math.random()*900000)+'-'+Date.now().toString().slice(-4); }

async function unlock(){
 if(pin.value!==PIN){ alert("Access Denied"); return; }
 GH_TOKEN=ghToken.value.trim()||localStorage.getItem(KEY_TOKEN)||"";
 if(!GH_TOKEN){ alert("GitHub Token Required"); return; }
 localStorage.setItem(KEY_TOKEN,GH_TOKEN);
 lockMsg.innerText="Loading...";
 try{ await loadData(); lock.style.display='none'; panel.style.display='block'; sDate.valueAsDate=new Date(); }
 catch(e){ lockMsg.innerText="Error: "+e.message; }
}
if(localStorage.getItem(KEY_TOKEN)) ghToken.value=localStorage.getItem(KEY_TOKEN);

async function toBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); }); }

async function getSHA(p){
 try{
   const url=`https://api.github.com/repos/byosites/byosites/contents/${p}`;
   const res=await fetch(url,{headers:{Authorization:`token ${GH_TOKEN}`}});
   if(res.status===404) return null;
   if(!res.ok){ let t=await res.text(); console.log("getSHA error",t); return null; }
   const j=await res.json(); return j.sha;
 }catch(e){ return null; }
}

async function uploadToGitHub(file,path){
 const content=await toBase64(file);
 const url=`https://api.github.com/repos/byosites/byosites/contents/${path}`;
 const sha=await getSHA(path);
 const body={message:`upload ${path}`,content}; if(sha) body.sha=sha;
 const res=await fetch(url,{method:"PUT",headers:{Authorization:`token ${GH_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!res.ok){ const t=await res.text(); throw new Error(t); }
 return path;
}

async function uploadJSON(path, jsonObj){
 const content=btoa(unescape(encodeURIComponent(JSON.stringify(jsonObj,null,2))));
 const url=`https://api.github.com/repos/byosites/byosites/contents/${path}`;
 const sha=await getSHA(path);
 const body={message:`update ${path}`,content}; if(sha) body.sha=sha;
 const res=await fetch(url,{method:"PUT",headers:{Authorization:`token ${GH_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!res.ok){ const t=await res.text(); throw new Error(t); }
}

async function fetchJSONFile(path){
 try{ const url=`https://byosites.github.io/byosites/${path}?t=${Date.now()}`; const res=await fetch(url); if(!res.ok) return null; return await res.json(); }
 catch(e){ return null; }
}

async function loadData(){
 let sData=await fetchJSONFile('music/songs.json'); let aData=await fetchJSONFile('music/artists.json'); let cData=await fetchJSONFile('music/secure_codes.json');
 if(sData && Array.isArray(sData)) songs=sData; else songs=JSON.parse(localStorage.getItem(KEY_SONGS)||"[]");
 if(aData && Array.isArray(aData)) artists=aData; else artists=JSON.parse(localStorage.getItem(KEY_ARTISTS)||"[]");
 if(cData && Array.isArray(cData)) secureCodes=cData; else secureCodes=JSON.parse(localStorage.getItem(KEY_SECURE_CODES)||"[]");
 localStorage.setItem(KEY_SONGS, JSON.stringify(songs)); localStorage.setItem(KEY_ARTISTS, JSON.stringify(artists)); localStorage.setItem(KEY_SECURE_CODES, JSON.stringify(secureCodes));
 render();
}

async function createArtist(){
 const name=aName.value.trim(); const pass=aPass.value.trim(); if(!name||!pass){ aMsg.innerText="Name and password required"; return; }
 const bio=aBio.value.trim(); if(!bio){ aMsg.innerText="Biography required"; return; }
 let photoFile=aPhotoFile.files[0]; let photoPath="";
 try{
  if(photoFile){ aMsg.innerText="Uploading photo..."; const pPath=`music/artist-${Date.now()}-${photoFile.name.replace(/\s+/g,'-')}`; await uploadToGitHub(photoFile,pPath); photoPath=pPath; }
  let idx=artists.findIndex(a=>a.name.toLowerCase()===name.toLowerCase());
  let code = idx>=0 && artists[idx].approvalCode ? artists[idx].approvalCode : genCode();
  aCodeShow.innerText=code;
  let obj={name,pass,wa:aWA.value,loc:aLoc.value,bio,genre:aGenre.value,year:aYear.value,fb:aFB.value,ig:aIG.value,yt:aYT.value,tik:aTik.value,photo:photoPath|| (idx>=0?artists[idx].photo:""), approvalCode:code, createdAt:new Date().toLocaleDateString(), suspended:false};
  if(idx>=0) artists[idx]={...artists[idx],...obj}; else artists.push(obj);
  aMsg.innerText="Saving to GitHub..."; await uploadJSON('music/artists.json', artists); localStorage.setItem(KEY_ARTISTS, JSON.stringify(artists));
  aMsg.innerHTML=`✅ ${name} saved - Code: <b style="color:#ffcc00">${code}</b>`;
  render();
 }catch(e){ aMsg.innerText="Failed: "+e.message; }
}

async function autoUpload(){
 const mp3=mp3File.files[0]; const cover=coverFile.files[0]; const artist=sArtist.value.trim(); const title=sTitle.value.trim();
 if(!artist||!title){ sMsg.innerText="Artist and Title required"; return; }
 if(!mp3||!cover){ sMsg.innerText="MP3 and Cover required"; return; }
 let artistData=artists.find(a=>a.name.toLowerCase()===artist.toLowerCase());
 if(!artistData){ sMsg.innerText="Create artist first"; return; }
 try{
  prog.style.width="10%"; sMsg.innerText="Uploading MP3..."; const mp3Path=`music/${Date.now()}-${mp3.name.replace(/\s+/g,'-')}`; await uploadToGitHub(mp3,mp3Path);
  prog.style.width="60%"; sMsg.innerText="Uploading cover..."; const coverPath=`music/${Date.now()}-${cover.name.replace(/\s+/g,'-')}`; await uploadToGitHub(cover,coverPath);
  prog.style.width="85%"; sMsg.innerText="Updating database...";
  const song={id:Date.now().toString(), artist, title, genre:sGenre.value, releaseDate:sDate.value, bio:sBio.value||artistData.bio, artistBio:artistData.bio, lyrics:sLyrics.value, credits:sCredits.value, isrc:sISRC.value, composer:sComposer.value||artist, explicit:sExplicit.value, img:coverPath, audio:mp3Path, wa:artistData.wa, approvalCode:artistData.approvalCode, sell:sSell.checked, featured:sFeatured.checked, price:sPrice.value||0, plays:0, likes:0, likedBy:[], ratings:{}, comments:[], suspended:false, created:new Date().toISOString()};
  songs.unshift(song); await uploadJSON('music/songs.json', songs); localStorage.setItem(KEY_SONGS, JSON.stringify(songs));
  prog.style.width="100%"; sMsg.innerHTML=`✅ Upload complete - ${title}`;
  render();
 }catch(e){ prog.style.width="0%"; sMsg.innerText="Failed: "+e.message; console.log(e); }
}

function render(){
 let q=(search.value||"").toLowerCase().trim();
 let fSongs=songs; let fArtists=artists;
 if(q){ fSongs=songs.filter(s=> `${s.title} ${s.artist} ${s.genre} ${s.bio||''} ${s.approvalCode||''}`.toLowerCase().includes(q)); fArtists=artists.filter(a=> `${a.name} ${a.bio} ${a.approvalCode}`.toLowerCase().includes(q)); searchInfo.innerText=`Results: ${fSongs.length} songs, ${fArtists.length} artists`; } else { searchInfo.innerText=`${songs.length} songs • ${artists.length} artists`; }
 count.innerText=`${songs.length} songs • ${artists.length} artists • ${secureCodes.filter(c=>!c.used && Date.now()<c.expires).length} active codes`;
 let activeCodes=secureCodes.filter(c=>!c.used && Date.now()<c.expires).sort((a,b)=>b.created-a.created);
 secureList.innerHTML=activeCodes.map(c=>{
   let totalSec=Math.max(0, Math.floor((c.expires-Date.now())/1000)); let mins=Math.floor(totalSec/60); let secs=totalSec%60;
   return `<div class="secureBox"><b style="color:#ffcc00">${c.code}</b> <span class="badge badge-secure">${mins}m ${secs}s left</span> <span class="badge badge-code">${c.forUser}</span><br><span style="font-size:11px">${c.songTitle} • ${c.forArtist} • $${c.price}</span><br><div class="row" style="margin-top:6px"><button class="btn btn-g" style="padding:6px;font-size:10px" onclick="sendCodeWA('${c.code}')">WhatsApp</button><button class="btn btn-b" style="padding:6px;font-size:10px" onclick="copyCode('${c.code}')">Copy</button><button class="btn btn-r" style="padding:6px;font-size:10px" onclick="revokeCode('${c.code}')">Revoke</button></div></div>`;
 }).join('')||"<p style='color:#666;font-size:11px'>No active codes</p>";
 artistList.innerHTML=fArtists.map(a=>`<div class="card ${a.suspended?'suspended':''}"><div style="display:flex;gap:10px"><img src="${a.photo?`https://byosites.github.io/byosites/${a.photo}`:'https://via.placeholder.com/60'}" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="flex:1"><b>${a.name}</b> <span class="badge badge-code">${a.approvalCode}</span><br><span style="font-size:11px;color:#888">${a.loc} • ${a.wa}</span></div></div><div class="row" style="margin-top:8px"><button class="btn btn-o" onclick="toggleSuspendArtist('${a.name}')">${a.suspended?'Unsuspend':'Suspend'}</button><button class="btn btn-b" onclick="editArtist('${a.name}')">Edit</button><button class="btn btn-r" onclick="deleteArtist('${a.name}')">Delete</button></div></div>`).join('')||"No artists";
 songList.innerHTML=fSongs.map(s=>`<div class="card ${s.suspended?'suspended':''}"><div style="display:flex;gap:10px"><img src="https://byosites.github.io/byosites/${s.img}" style="width:70px;height:70px;border-radius:8px;object-fit:cover"><div style="flex:1"><b>${s.title}</b> - ${s.artist} ${s.suspended?'<span class="badge badge-sus">SUS</span>':'<span class="badge badge-live">LIVE</span>'} <span class="badge badge-code">${s.approvalCode}</span> ${s.sell?`<span class="badge badge-secure">$${s.price} PAID</span>`:`<span class="badge badge-free">FREE</span>`}<br><span style="font-size:10px;color:#666">${s.genre}</span></div></div><audio controls preload="none" src="https://byosites.github.io/byosites/${s.audio}" style="margin-top:8px"></audio><div class="row" style="margin-top:6px"><button class="btn btn-y" onclick="window.open('https://byosites.github.io/byosites/${s.audio}','_blank')">Test</button><button class="btn btn-blue" onclick="genSecureCode('${s.id}')">Generate Code</button><button class="btn btn-b" onclick="prepareEdit('${s.id}')">Edit</button><button class="btn btn-o" onclick="toggleSuspendSong('${s.id}')">Suspend</button><button class="btn btn-r" onclick="requestDeleteSong('${s.id}')">Delete</button></div></div>`).join('')||"No songs";
}
function getAvg(s){ if(!s.ratings) return 0; let vals=Object.values(s.ratings); if(vals.length===0) return 0; return vals.reduce((a,b)=>a+b,0)/vals.length; }
async function genSecureCode(id){ let buyer=prompt("Enter buyer username:")||"GENERIC"; let s=songs.find(x=>x.id===id); if(!s) return; if(!s.sell){ alert("Free song - no code needed"); return; } let code=genSecureCodeOnly(); let entry={code:code, songId:id, songTitle:s.title, forUser:buyer, forArtist:s.artist, created:Date.now(), expires:Date.now()+600000, used:false, price:s.price}; secureCodes.push(entry); localStorage.setItem(KEY_SECURE_CODES, JSON.stringify(secureCodes)); await uploadJSON('music/secure_codes.json', secureCodes).catch(e=>{console.log(e)}); alert(`Code: ${code} for ${buyer} - Valid 10 mins`); render(); }
function sendCodeWA(code){ let c=secureCodes.find(x=>x.code===code); if(!c) return; let msg=`Hi ${c.forUser}! Your code for ${c.songTitle} is ${c.code}. Expires in 10 mins.`; let wa=prompt("Enter WhatsApp number:")||""; if(wa){ window.open(`https://wa.me/${wa.replace(/\+/g,'')}?text=${encodeURIComponent(msg)}`,'_blank'); } }
function copyCode(code){ navigator.clipboard.writeText(code); alert("Copied: "+code); }
async function revokeCode(code){ if(!confirm("Revoke "+code+"?")) return; secureCodes=secureCodes.filter(c=>c.code!==code); localStorage.setItem(KEY_SECURE_CODES, JSON.stringify(secureCodes)); await uploadJSON('music/secure_codes.json', secureCodes).catch(()=>{}); render(); }
async function clearExpired(){ let expired=secureCodes.filter(c=>!c.used && Date.now()>=c.expires).length; secureCodes=secureCodes.filter(c=>c.used || Date.now()<c.expires); localStorage.setItem(KEY_SECURE_CODES, JSON.stringify(secureCodes)); await uploadJSON('music/secure_codes.json', secureCodes).catch(()=>{}); alert(`Cleared ${expired} expired codes`); render(); }
function editArtist(name){ let a=artists.find(x=>x.name===name); if(a){ aName.value=a.name; aPass.value=a.pass; aWA.value=a.wa; aLoc.value=a.loc; aBio.value=a.bio; aGenre.value=a.genre; aYear.value=a.year; aFB.value=a.fb; aIG.value=a.ig; aYT.value=a.yt; aTik.value=a.tik; aCodeShow.innerText=a.approvalCode; window.scrollTo(0,0); } }
async function toggleSuspendArtist(name){ let a=artists.find(x=>x.name===name); if(a){ a.suspended=!a.suspended; localStorage.setItem(KEY_ARTISTS, JSON.stringify(artists)); await uploadJSON('music/artists.json', artists).catch(()=>{}); render(); } }
async function deleteArtist(name){ let code=prompt(`Delete ${name}? Enter Approval Code:`); let a=artists.find(x=>x.name===name); if(!a) return; if(code!==a.approvalCode){ alert("Wrong code"); return; } artists=artists.filter(x=>x.name!==name); localStorage.setItem(KEY_ARTISTS, JSON.stringify(artists)); await uploadJSON('music/artists.json', artists).catch(()=>{}); render(); }
function prepareEdit(id){ let s=songs.find(x=>x.id===id); if(s){ editId.value=s.id; editTitle.value=s.title; editBio.value=s.bio; editPrice.value=s.price; editApproval.value=""; window.scrollTo(0,400); } }
async function saveEditMusic(){ let id=editId.value; if(!id){ alert("Click Edit first"); return; } let code=editApproval.value.trim(); let s=songs.find(x=>x.id===id); if(!s) return; if(code!==s.approvalCode){ alert(`Wrong approval code`); return; } if(editTitle.value) s.title=editTitle.value; if(editBio.value) s.bio=editBio.value; if(editPrice.value) s.price=editPrice.value; localStorage.setItem(KEY_SONGS, JSON.stringify(songs)); await uploadJSON('music/songs.json', songs).catch(()=>{}); alert("Updated"); render(); clearEdit(); }
function clearEdit(){ editId.value=""; editTitle.value=""; editBio.value=""; editPrice.value=""; editApproval.value=""; }
async function toggleSuspendSong(id){ let code=prompt("Enter Approval Code:"); let s=songs.find(x=>x.id===id); if(!s) return; if(code!==s.approvalCode){ alert("Wrong code"); return; } s.suspended=!s.suspended; localStorage.setItem(KEY_SONGS, JSON.stringify(songs)); await uploadJSON('music/songs.json', songs).catch(()=>{}); render(); }
function requestDeleteSong(id){ let s=songs.find(x=>x.id===id); if(!s) return; let code=prompt(`DELETE ${s.title}? Enter Code:`); if(code!==s.approvalCode){ alert("Wrong code"); return; } if(!confirm("Delete from GitHub?")) return; deleteSong(id,s.audio,s.img); }
async function deleteSong(id,audioPath,imgPath){
 try{
  sMsg.innerText="Deleting...";
  let shaA=await getSHA(audioPath); if(shaA){ await fetch(`https://api.github.com/repos/byosites/byosites/contents/${audioPath}`,{method:"DELETE",headers:{Authorization:`token ${GH_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Delete ${audioPath}`,sha:shaA})}); }
  let shaI=await getSHA(imgPath); if(shaI){ try{ await fetch(`https://api.github.com/repos/byosites/byosites/contents/${imgPath}`,{method:"DELETE",headers:{Authorization:`token ${GH_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Delete ${imgPath}`,sha:shaI})}); }catch(e){} }
  songs=songs.filter(x=>x.id!==id); localStorage.setItem(KEY_SONGS, JSON.stringify(songs)); await uploadJSON('music/songs.json', songs).catch(()=>{});
  sMsg.innerText="✅ Deleted"; render();
 }catch(e){ sMsg.innerText="Failed: "+e.message; }
}
function exportData(){ let blob=new Blob([JSON.stringify(songs,null,2)],{type:"application/json"}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`backup-${Date.now()}.json`; a.click(); }
setInterval(()=>{ render(); }, 5000);
</script>
